[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swappy-paper"
version = "0.1.0"
description = "Reproducible reference implementation for anomalous transport in U(1)-symmetric quantum circuits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[project.scripts]
swappy-reproduce = "swappy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

