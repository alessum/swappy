[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swappy-paper"
version = "0.1.0"
description = "Swappy: Anomalous transport in U(1)-symmetric quantum circuits"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "swappy",
  "swappy regime",
  "quantum transport",
  "Floquet circuits",
  "U(1) symmetry",
  "disordered systems",
  "reproducible research",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[project.urls]
Homepage = "https://doi.org/10.1038/s41534-025-01178-8"
Paper = "https://doi.org/10.1038/s41534-025-01178-8"
Repository = "https://github.com/alessum/swappy"
Documentation = "https://github.com/alessum/swappy/blob/main/docs/REPRODUCIBILITY.md"

[tool.setuptools.packages.find]
where = ["src"]
